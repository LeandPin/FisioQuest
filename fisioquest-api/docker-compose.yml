services:
  postgres:
    image: postgres:16-alpine
    container_name: fisioquest-db
    environment:
      POSTGRES_DB: fisioquest
      POSTGRES_USER: fisioquest
      POSTGRES_PASSWORD: fisioquest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisioquest -d fisioquest"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: fisioquest-mailhog
    ports:
      - "1025:1025"   # SMTP (usado pelo Spring Boot)
      - "8025:8025"   # Web UI para visualizar e-mails capturados

volumes:
  pgdata:
