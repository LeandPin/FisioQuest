# Test configuration - uses Testcontainers for PostgreSQL
spring.application.name=fisioquest

# Database - configured dynamically via @DynamicPropertySource in test classes
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT - use test keys from classpath
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:test-keys/public.pem
app.security.jwt.private-key-location=classpath:test-keys/private.pem

# CORS
app.cors.allowed-origins=http://localhost:3000

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Mail / Email service stubs for tests
app.mail.from=noreply@fisioquest.ufpb.br
app.base-url=http://localhost:8080
app.allowed-email-domains=ci.ufpb.br,academico.ufpb.br,test.com
