# ===== Dev Profile - Local Development =====
# Use with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev

# Database (docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:5432/fisioquest
spring.datasource.username=fisioquest
spring.datasource.password=fisioquest

# JWT keys (reusing test keys for local dev)
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:test-keys/public.pem
app.security.jwt.private-key-location=classpath:test-keys/private.pem

# CORS
app.cors.allowed-origins=http://localhost:3000

# JPA/Hibernate JSONB support
spring.jpa.properties.hibernate.type.preferred_json_type=jsonb
