# ===== Dev Profile - Local Development =====
# Use with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev

# Database (docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:5432/fisioquest
spring.datasource.username=fisioquest
spring.datasource.password=fisioquest

# JWT keys (reusing test keys for local dev)
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:test-keys/public.pem
app.security.jwt.private-key-location=classpath:test-keys/private.pem

# CORS
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# JPA/Hibernate JSONB support
spring.jpa.properties.hibernate.type.preferred_json_type=jsonb

# ===== E-mail (dev local - MailHog) =====
# Inicie com: docker compose up -d
# Interface web dos e-mails capturados: http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=noreply@fisioquest.local
app.base-url=http://localhost:8080

# Dominios aceitos em dev (inclui dominios de teste)
app.allowed-email-domains=ci.ufpb.br,academico.ufpb.br,gmail.com,test.com
