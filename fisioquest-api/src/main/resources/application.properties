spring.application.name=fisioquest

# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== Database =====
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.preferred_json_type=jsonb

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Spring Security / OAuth2 Resource Server (JWT RS256) =====
spring.security.oauth2.resourceserver.jwt.public-key-location=${JWT_PUBLIC_KEY}

# ===== JWT signing keys (used by TokenService) =====
app.security.jwt.private-key-location=${JWT_PRIVATE_KEY}

# ===== CORS =====
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# ===== Actuator =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ===== Logging (structured text to stdout/stderr) =====
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=
