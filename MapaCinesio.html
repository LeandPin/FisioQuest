<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mapa de Cinesiofobia - FisioQuest</title>
    <link rel="stylesheet" href="StyleQuest.css">
    <style>
        .corpo-container { display: flex; justify-content: center; gap: 50px; padding: 20px; }
        .membro { fill: #e0e0e0; stroke: #fff; stroke-width: 2; cursor: pointer; transition: 0.3s; }
        .membro:hover { fill: #4facfe; }
        
        /* Cores de Cinesiofobia */
        .nivel-1 { fill: #28a745; } /* Baixo */
        .nivel-2 { fill: #ffc107; } /* Moderado */
        .nivel-3 { fill: #fd7e14; } /* Intenso */
        .nivel-4 { fill: #dc3545; } /* Muito Intenso */

        #painel-ajuste { text-align: center; margin-top: 20px; display: none; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="index.html" class="logo"><img src="images/LOGO2.png" alt="Logo"></a>
        <div class="menu"><a href="SelecionarQuest.html">Voltar</a></div>
    </div>

    <section id="questionarios">
        <h2>Mapa de Medo do Movimento</h2>
        <p>Clique na parte do corpo onde você sente medo de realizar movimentos.</p>

        <div class="corpo-container">
            <svg width="200" height="400" viewBox="0 0 200 400">
                <circle id="cabeca" class="membro" cx="100" cy="40" r="30" onclick="selecionarParte('Cabeça', 'cabeca')" />
                <rect id="tronco" class="membro" x="70" y="80" width="60" height="120" rx="10" onclick="selecionarParte('Tronco/Coluna', 'tronco')" />
                <rect id="braco_esq" class="membro" x="30" y="85" width="30" height="100" rx="15" onclick="selecionarParte('Braço Esquerdo', 'braco_esq')" />
                <rect id="braco_dir" class="membro" x="140" y="85" width="30" height="100" rx="15" onclick="selecionarParte('Braço Direito', 'braco_dir')" />
                <rect id="perna_esq" class="membro" x="70" y="210" width="25" height="150" rx="10" onclick="selecionarParte('Perna Esquerda', 'perna_esq')" />
                <rect id="perna_dir" class="membro" x="105" y="210" width="25" height="150" rx="10" onclick="selecionarParte('Perna Direita', 'perna_dir')" />
            </svg>
        </div>

        <div id="painel-ajuste">
            <h3 id="nome-parte">Parte Selecionada</h3>
            <label>Nível de Medo (1 a 4):</label>
            <select id="nivel-medo">
                <option value="1">1 - Mínimo (Verde)</option>
                <option value="2">2 - Moderado (Amarelo)</option>
                <option value="3">3 - Intenso (Laranja)</option>
                <option value="4">4 - Muito Intenso (Vermelho)</option>
            </select>
            <button class="cta-button" onclick="salvarMedo()">Aplicar</button>
        </div>
    </section>

    <script>
        let parteAtual = null;
        let idElementoAtual = null;

        function selecionarParte(nome, id) {
            parteAtual = nome;
            idElementoAtual = id;
            document.getElementById('painel-ajuste').style.display = 'block';
            document.getElementById('nome-parte').innerText = nome;
        }

        function salvarMedo() {
            const nivel = document.getElementById('nivel-medo').value;
            const el = document.getElementById(idElementoAtual);
            
            // Remove classes antigas
            el.classList.remove('nivel-1', 'nivel-2', 'nivel-3', 'nivel-4');
            // Adiciona a nova cor
            el.classList.add('nivel-' + nivel);
            
            alert(parteAtual + " definido com nível de medo " + nivel);
            document.getElementById('painel-ajuste').style.display = 'none';
        }
    </script>
</body>
</html>
